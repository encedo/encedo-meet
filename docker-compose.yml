services:

    # -------------------------------------------------------------------------
    # Reverse proxy + automatic TLS (Let's Encrypt)
    # -------------------------------------------------------------------------
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        environment:
            - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
            - MEET_DOMAIN=${MEET_DOMAIN}
            - API_DOMAIN=${API_DOMAIN}
            - MEET_DOMAIN_URL=${MEET_DOMAIN_URL}
        networks:
            - meet.jitsi
        depends_on:
            - web
            - encedo-host

    # -------------------------------------------------------------------------
    # Jitsi Meet — oficjalny obraz, nasze pliki podmontowane jako volume
    # Przed uruchomieniem: cd ../jitsi-meet && make LIBJITSIMEET_DIR=../lib-jitsi-meet compile deploy
    # Aktualizacja: git pull && make ... && docker compose restart web
    # -------------------------------------------------------------------------
    web:
        image: jitsi/web:${JITSI_IMAGE_VERSION:-unstable}
        restart: unless-stopped
        expose:
            - "80"
        volumes:
            - ../jitsi-meet/libs:/usr/share/jitsi-meet/libs:ro
            - ../jitsi-meet/index.html:/usr/share/jitsi-meet/index.html:ro
            - ${CONFIG:-~/.jitsi-meet-cfg}/web:/config:Z
        environment:
            - PUBLIC_URL=https://${API_DOMAIN}
            - XMPP_SERVER=${XMPP_SERVER:-xmpp.meet.jitsi}
            - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
            - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
            - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
            - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
            - XMPP_GUEST_DOMAIN=${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
            - JICOFO_AUTH_USER=focus
            - DISABLE_HTTPS=1
            - ENABLE_HTTP_REDIRECT=0
            - TZ=${TZ:-UTC}
        networks:
            - meet.jitsi
        depends_on:
            - prosody

    # -------------------------------------------------------------------------
    # encedo-meet-host — React app
    # Przed uruchomieniem: npm run build
    # Aktualizacja: git pull && npm run build && docker compose restart encedo-host
    # -------------------------------------------------------------------------
    encedo-host:
        image: nginx:alpine
        restart: unless-stopped
        expose:
            - "80"
        volumes:
            - ./dist:/usr/share/nginx/html:ro
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - meet.jitsi

    # -------------------------------------------------------------------------
    # Jitsi backend — obrazy oficjalne, nie wymagają rebuild przy zmianach kodu
    # -------------------------------------------------------------------------
    prosody:
        image: jitsi/prosody:${JITSI_IMAGE_VERSION:-unstable}
        restart: unless-stopped
        expose:
            - "5222"
            - "5347"
            - "5280"
        volumes:
            - ${CONFIG:-~/.jitsi-meet-cfg}/prosody:/config:Z
        environment:
            - AUTH_TYPE=internal
            - ENABLE_AUTH=1
            - ENABLE_GUESTS=0
            - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
            - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
            - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
            - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
            - XMPP_GUEST_DOMAIN=${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
            - XMPP_RECORDER_DOMAIN=${XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
            - JICOFO_AUTH_USER=focus
            - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD:?missing}
            - JVB_AUTH_USER=jvb
            - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:?missing}
            - TZ=${TZ:-UTC}
        networks:
            meet.jitsi:
                aliases:
                    - ${XMPP_SERVER:-xmpp.meet.jitsi}
                    - ${XMPP_DOMAIN:-meet.jitsi}
                    - ${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
                    - ${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
                    - ${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}

    jicofo:
        image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-unstable}
        restart: unless-stopped
        volumes:
            - ${CONFIG:-~/.jitsi-meet-cfg}/jicofo:/config:Z
        environment:
            - AUTH_TYPE=internal
            - XMPP_SERVER=${XMPP_SERVER:-xmpp.meet.jitsi}
            - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
            - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
            - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
            - JICOFO_AUTH_USER=focus
            - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD:?missing}
            - TZ=${TZ:-UTC}
        networks:
            - meet.jitsi
        depends_on:
            - prosody

    jvb:
        image: jitsi/jvb:${JITSI_IMAGE_VERSION:-unstable}
        restart: unless-stopped
        ports:
            - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
        volumes:
            - ${CONFIG:-~/.jitsi-meet-cfg}/jvb:/config:Z
        environment:
            - XMPP_SERVER=${XMPP_SERVER:-xmpp.meet.jitsi}
            - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
            - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
            - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
            - JVB_AUTH_USER=jvb
            - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:?missing}
            - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS:?missing}
            - JVB_PORT=${JVB_PORT:-10000}
            - TZ=${TZ:-UTC}
        networks:
            - meet.jitsi
        depends_on:
            - prosody

networks:
    meet.jitsi:

volumes:
    caddy_data:
    caddy_config:
